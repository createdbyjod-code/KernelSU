name: ClangFormat check

on:
  push:
    branches:
      - 'main'
      - 'dev'
    paths:
      - '.github/workflows/clang-format.yml'
      - 'kernel/**/*.c'
      - 'kernel/**/*.h'
  pull_request:
    branches:
      - 'main'
      - 'dev'
    paths:
      - '.github/workflows/clang-format.yml'
      - 'kernel/**/*.c'
      - 'kernel/**/*.h'
      - 'kernel/.clang-format'

permissions:
  checks: write

jobs:
  format:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_FILE: /tmp/weather.jks
    steps:
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > /tmp/weather.jks
      - uses: actions/checkout@v7

      - name: check
        working-directory: kernel
        run: make check-format
